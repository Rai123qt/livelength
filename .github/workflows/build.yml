# Compile check for pull requests (uses the AutoCAD 2027 .NET API package, no AutoCAD needed).
name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build LiveLengthManager/LiveLengthManager.csproj -c Release
      - run: dotnet build LiveLengthManager.Loader/LiveLengthManager.Loader.csproj -c Release
